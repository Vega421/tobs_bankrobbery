name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # by hand: only the tests, no release

permissions:
  contents: write

jobs:
  # The tests are kept in a private repo (tobs_bankrobbery-dev), read with a read-only deploy key
  # (the DEV_DEPLOY_KEY secret). A release is only published when they pass.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tobs_bankrobbery
      - uses: actions/checkout@v4
        with:
          repository: Vega421/tobs_bankrobbery-dev
          ssh-key: ${{ secrets.DEV_DEPLOY_KEY }}
          path: tobs_bankrobbery-dev
      - name: Install Lua 5.4
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.4
      - name: Tests
        run: ./tobs_bankrobbery-dev/run-tests.sh

  release:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          mkdir -p dist/tobs_bankrobbery
          cp -r fxmanifest.lua config locales bridge client server stream install LICENSE dist/tobs_bankrobbery/
          cd dist && zip -r "tobs_bankrobbery-${GITHUB_REF_NAME}.zip" tobs_bankrobbery

      - name: Release notes from CHANGELOG.md
        run: python3 .github/release_notes.py "${GITHUB_REF_NAME}" > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: tobs_bankrobbery ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*.zip
